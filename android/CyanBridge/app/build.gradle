plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.kotlin.compose.compiler)
    alias(libs.plugins.ksp)
}

configurations.configureEach {
    resolutionStrategy {
        force 'androidx.core:core:1.15.0'
        force 'androidx.core:core-ktx:1.15.0'
    }
}

def keystorePropertiesFile = rootProject.file("keystore.properties")

def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localProperties.load(new FileInputStream(localPropertiesFile))
}
def metaGithubToken = System.getenv("GITHUB_TOKEN") ?: localProperties.getProperty("github_token")
def metaDatEnabled = metaGithubToken != null && !metaGithubToken.trim().isEmpty()

android {
    namespace = "com.fersaiyan.cyanbridge"
    compileSdk = 35

    // Align app-packaged native code with 16 KB page-size devices (Android 15+).
    ndkVersion = "28.2.13676358"

    defaultConfig {
        applicationId = "com.fersaiyan.cyanbridge"
        // Meta DAT declares minSdk 29. Keep the regular build on API 24 if Meta SDK is skipped.
        minSdk = metaDatEnabled ? 29 : 24
        targetSdk = 35
        versionCode = 14
        versionName = "2.1.0"
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"

        // Ship only arm64-v8a. Extra ABIs from third-party AARs (armeabi-v7a/x86/…)
        // bloat the APK and often still ship 4 KB-aligned LOAD segments that trip
        // Play / PackageManager 16 KB checks on modern devices.
        ndk {
            abiFilters "arm64-v8a"
        }

        // Chapter 6: optional transcription API key (do not commit secrets).
        def openAiKey = project.findProperty("OPENAI_API_KEY") ?: ""
        buildConfigField "String", "OPENAI_API_KEY", "\"${openAiKey}\""

        def proCheapSku = project.findProperty("PRO_CHEAP_SKU") ?: "pro_cheap"
        def proStandardSku = project.findProperty("PRO_STANDARD_SKU") ?: "pro_standard"
        def proMaxSku = project.findProperty("PRO_MAX_SKU") ?: "pro_max"
        // Never fall back to the first Play offer. Configure a base plan for each product,
        // and an offer ID only when that specific promotional offer should be purchased.
        def proCheapBasePlanId = project.findProperty("PRO_CHEAP_BASE_PLAN_ID") ?: "pro-cheap"
        def proStandardBasePlanId = project.findProperty("PRO_STANDARD_BASE_PLAN_ID") ?: "pro-standard"
        def proMaxBasePlanId = project.findProperty("PRO_MAX_BASE_PLAN_ID") ?: "pro-max"
        def proCheapOfferId = project.findProperty("PRO_CHEAP_OFFER_ID") ?: ""
        def proStandardOfferId = project.findProperty("PRO_STANDARD_OFFER_ID") ?: ""
        def proMaxOfferId = project.findProperty("PRO_MAX_OFFER_ID") ?: ""
        def proMonthlySku = project.findProperty("PRO_MONTHLY_SKU") ?: "pro_monthly"
        def proYearlySku = project.findProperty("PRO_YEARLY_SKU") ?: "pro_yearly"
        def proVerifyUrl = project.findProperty("PRO_SUB_VERIFY_URL") ?: ""
        def webSubscribeUrl = project.findProperty("WEB_SUBSCRIBE_URL") ?: ""
        def webAllowedCountries = project.findProperty("WEB_SUB_ALLOWED_COUNTRIES") ?: ""
        def donationUrl = project.findProperty("DONATION_URL") ?: "https://buymeacoffee.com/"
        buildConfigField "String", "PRO_CHEAP_SKU", "\"${proCheapSku}\""
        buildConfigField "String", "PRO_STANDARD_SKU", "\"${proStandardSku}\""
        buildConfigField "String", "PRO_MAX_SKU", "\"${proMaxSku}\""
        buildConfigField "String", "PRO_CHEAP_BASE_PLAN_ID", "\"${proCheapBasePlanId}\""
        buildConfigField "String", "PRO_STANDARD_BASE_PLAN_ID", "\"${proStandardBasePlanId}\""
        buildConfigField "String", "PRO_MAX_BASE_PLAN_ID", "\"${proMaxBasePlanId}\""
        buildConfigField "String", "PRO_CHEAP_OFFER_ID", "\"${proCheapOfferId}\""
        buildConfigField "String", "PRO_STANDARD_OFFER_ID", "\"${proStandardOfferId}\""
        buildConfigField "String", "PRO_MAX_OFFER_ID", "\"${proMaxOfferId}\""
        buildConfigField "String", "PRO_MONTHLY_SKU", "\"${proMonthlySku}\""
        buildConfigField "String", "PRO_YEARLY_SKU", "\"${proYearlySku}\""
        buildConfigField "String", "PRO_SUB_VERIFY_URL", "\"${proVerifyUrl}\""
        buildConfigField "String", "WEB_SUBSCRIBE_URL", "\"${webSubscribeUrl}\""
        buildConfigField "String", "WEB_SUB_ALLOWED_COUNTRIES", "\"${webAllowedCountries}\""
        buildConfigField "String", "DONATION_URL", "\"${donationUrl}\""

        vectorDrawables {
            useSupportLibrary = true
        }
    }

    signingConfigs {
        release {
            // Only configure signing if keystore.properties exists.
            if (keystorePropertiesFile.exists()) {
                storeFile = file(keystoreProperties["storeFile"])
                storePassword = keystoreProperties["storePassword"]
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            if (keystorePropertiesFile.exists()) {
                signingConfig = signingConfigs.release
            }
            proguardFiles(
                getDefaultProguardFile("proguard-android-optimize.txt"),
                "proguard-rules.pro"
            )
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
        freeCompilerArgs += ["-Xskip-metadata-version-check"]
    }

    buildFeatures {
        viewBinding = true
        buildConfig = true
        compose = true
        aidl = true
    }

    // MYVU's protocol is maintained as a pinned upstream submodule. The source
    // contains the hardware-verified StarryNet BLE/ECDH/RFCOMM implementation.
    sourceSets {
        main {
            java.srcDir("src/main/myvu-upstream/android/app/src/main/java")
            assets.srcDir("src/main/myvu-upstream/android/app/src/main/assets")
            java.exclude("com/myvu/client/ui/**")
            java.exclude("com/myvu/client/service/MyvuService.java")
            java.exclude("com/myvu/client/service/MirrorNotificationListener.java")
        }
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    // Uncompressed, 16 KB-zipaligned .so packaging (AGP 8.5.1+). Required so the
    // installer can mmap native libs on 16 KB page-size devices.
    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}


dependencies {
    def localLlamaRuntimeAarPath = (
            project.findProperty("localLlamaRuntimeAarPath")
                    ?: ""
    ).toString().trim()
    def coreConnectivityVersion = project.findProperty("heycyanCoreConnectivityVersion") ?: "0.1.0-SNAPSHOT"
    implementation("com.heycyan.core:core-connectivity:${coreConnectivityVersion}")
    implementation project(":shared")
    implementation files("libs/glasses_sdk_20250723_v01.aar")
    implementation(libs.androidx.core.ktx)
    implementation(libs.androidx.appcompat)
    implementation("androidx.core:core:1.15.0")
    implementation("androidx.core:core-ktx:1.15.0")

    implementation(libs.androidx.activity.compose)
    implementation(platform(libs.androidx.compose.bom))
    implementation(libs.androidx.ui)
    implementation(libs.androidx.ui.graphics)
    implementation(libs.androidx.ui.tooling.preview)
    implementation(libs.androidx.material3)
    implementation("androidx.compose.material:material-icons-extended")
    debugImplementation(libs.androidx.ui.tooling)
    debugImplementation(libs.androidx.ui.test.manifest)

    implementation("com.google.android.material:material:1.12.0")
    implementation "androidx.browser:browser:1.8.0"
    implementation("com.github.getActivity:XXPermissions:20.0")
    implementation("org.greenrobot:eventbus:3.2.0")
    implementation("com.github.ForgetAll:LoadingDialog:v1.1.2")
    implementation("androidx.localbroadcastmanager:localbroadcastmanager:1.1.0")
    implementation("com.github.CymChad:BaseRecyclerViewAdapterHelper:3.0.4")
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-exoplayer-rtsp:1.5.1'
    implementation 'androidx.media3:media3-ui:1.5.1'
    implementation "androidx.security:security-crypto:1.1.0-alpha06"
    implementation 'com.android.billingclient:billing-ktx:8.1.0'
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.0"
    implementation "androidx.work:work-runtime-ktx:2.9.1"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
    implementation "dev.rikka.shizuku:api:13.1.5"
    implementation "dev.rikka.shizuku:provider:13.1.5"
    implementation "com.google.android.gms:play-services-location:21.3.0"
    if (localLlamaRuntimeAarPath.isEmpty()) {
        implementation "io.github.ljcamargo:llamacpp-kotlin:0.2.0"
    } else {
        def localLlamaRuntimeAar = rootProject.file(localLlamaRuntimeAarPath)
        if (!localLlamaRuntimeAar.exists()) {
            throw new GradleException("localLlamaRuntimeAarPath points to a missing file: ${localLlamaRuntimeAar.absolutePath}")
        }
        logger.lifecycle("Using local llama runtime AAR: ${localLlamaRuntimeAar.absolutePath}")
        implementation files(localLlamaRuntimeAar)
    }

    // LiteRT runtime for local models (Google's inference engine)
    implementation("com.google.ai.edge.litertlm:litertlm-android:0.14.0")

    // Walking Aid vision runtime. Use LiteRT (ex-TFLite) packages that ship
    // 16 KB-aligned native libs; org.tensorflow:tensorflow-lite 2.16/2.17 is 4 KB
    // only and fails PackageManager / Play 16 KB checks. Interpreter API packages
    // remain org.tensorflow.lite.* so Kotlin call sites need no changes.
    // Stay on the 1.4.x line: GPU Interpreter support is documented for V1 only.
    def litertVersion = "1.4.2"
    implementation("com.google.ai.edge.litert:litert:${litertVersion}")
    implementation("com.google.ai.edge.litert:litert-gpu:${litertVersion}")
    implementation("com.google.ai.edge.litert:litert-support:${litertVersion}")

    // Offline transcription (Moonshine; vendored module, rebuilt with 16 KB pages)
    implementation project(":moonshine-voice")

    // Vosk removed from the APK: libvosk.so has no 16 KB-aligned release and is
    // unused (Moonshine is the offline path). Source under ai/transcription/vosk
    // is kept for reference but excluded from compilation below.

    // Chapter 2 storage
    def room_version = "2.7.0"
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    ksp "androidx.room:room-compiler:$room_version"

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.12.2'
    testImplementation 'androidx.test:core:1.6.1'
    testImplementation "androidx.room:room-testing:$room_version"

    // Meta Wearables DAT SDK for Meta Ray-Ban glasses integration.
    // Requires GitHub token with read:packages scope in GITHUB_TOKEN env var
    // (or github_token in local.properties). Without credentials the app still
    // compiles against :meta-dat-stubs so HeyCyan builds work offline; Meta
    // Ray-Ban runtime features will report DAT unavailable.
    def metaDatVersion = "0.8.0"
    if (metaDatEnabled) {
        implementation("com.meta.wearable:mwdat-core:${metaDatVersion}")
        implementation("com.meta.wearable:mwdat-camera:${metaDatVersion}")
        implementation("com.meta.wearable:mwdat-display:${metaDatVersion}")
        implementation("com.meta.wearable:mwdat-mockdevice:${metaDatVersion}")
    } else {
        logger.warn("No GitHub package token configured - using Meta DAT compile stubs (Meta Ray-Ban runtime disabled).")
        implementation project(":meta-dat-stubs")
    }

    // Chapter 4 UI gating test (androidTest)
    androidTestImplementation 'androidx.test:core-ktx:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.1'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation(platform(libs.androidx.compose.bom))
    androidTestImplementation(libs.androidx.ui.test.junit4)
}
