plugins {
    id 'com.android.library'
}

android {
    namespace = 'ai.moonshine.voice'
    compileSdk = 35

    // NDK r28+ defaults ELF LOAD segments to 16 KB page alignment (required for
    // Android 15+ 16 KB devices / Play policy). NDK 27 linked at 4 KB (0x1000).
    ndkVersion = '28.2.13676358'

    defaultConfig {
        minSdk = 24

        // Keep release APK size reasonable (matches most modern phones).
        // If you need emulator/x86 later, add it.
        ndk {
            abiFilters 'arm64-v8a'
        }

        // Only build the JNI shared library. The upstream CMake root also defines
        // benchmarks and unit-test binaries; building those fails under -Werror
        // for unused helpers and bloats the Android build by hundreds of targets.
        //
        // Upstream enables -Werror. NDK clang occasionally flags unused static
        // helpers in the shared library graph (e.g. clone_asr_for_tts_handle).
        // Downgrade only that diagnostic so we do not patch the vendored tree.
        //
        // Explicit 16 KB page-size flags keep alignment correct even if the NDK
        // default changes, and match https://developer.android.com/guide/practices/page-sizes
        externalNativeBuild {
            cmake {
                targets 'moonshine-jni'
                arguments '-DCMAKE_CXX_FLAGS=-Wno-error=unused-function',
                        '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON',
                        '-DCMAKE_SHARED_LINKER_FLAGS=-Wl,-z,max-page-size=16384 -Wl,-z,common-page-size=16384',
                        '-DCMAKE_EXE_LINKER_FLAGS=-Wl,-z,max-page-size=16384 -Wl,-z,common-page-size=16384'
            }
        }

        consumerProguardFiles 'consumer-rules.pro'
    }

    sourceSets {
        main {
            // Reuse Moonshine's Java bindings directly from the vendored repo.
            java.srcDirs += [
                '../../../third_party/moonshine/android/java/main'
            ]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            // Moonshine builds the JNI lib (moonshine-jni) from this root CMake.
            path = file('../../../third_party/moonshine/core/CMakeLists.txt')
            version = '3.22.1'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.12.0'

    // Required by the vendored Moonshine Java bindings compiled from
    // third_party/moonshine/android/java/main. AssetDownloader uses OkHttp for model
    // downloads and MoonshineDownloadWorker is a WorkManager Worker; neither was declared
    // here, so the module could not compile against the pinned upstream. Versions match
    // the app module so Gradle does not have to resolve two of each onto the classpath.
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.work:work-runtime:2.9.1'
}
