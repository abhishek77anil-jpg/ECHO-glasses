plugins {
    id 'com.android.library'
}

android {
    namespace = 'ai.moonshine.voice'
    compileSdk = 35

    defaultConfig {
        minSdk = 24

        // Keep release APK size reasonable (matches most modern phones).
        // If you need emulator/x86 later, add it.
        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                // Moonshine's own CMake builds with -Werror, and NDK 27's clang rejects
                // upstream code we do not own (an unused static in moonshine-c-api.cpp).
                // Downgrading their warnings-as-errors is the only sane option short of
                // patching a vendored third-party source tree; it changes nothing about
                // how our code is compiled.
                cFlags '-Wno-error'
                cppFlags '-Wno-error'
            }
        }

        consumerProguardFiles 'consumer-rules.pro'
    }

    sourceSets {
        main {
            // Reuse Moonshine's Java bindings directly from the vendored repo.
            java.srcDirs += [
                '../../../third_party/moonshine/android/java/main'
            ]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            // Moonshine builds the JNI lib (moonshine-jni) from this root CMake.
            path = file('../../../third_party/moonshine/core/CMakeLists.txt')
            version = '3.22.1'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.12.0'

    // Required by the vendored Moonshine Java bindings compiled from
    // third_party/moonshine/android/java/main. AssetDownloader uses OkHttp for model
    // downloads and MoonshineDownloadWorker is a WorkManager Worker; neither was declared
    // here, so the module could not compile against the pinned upstream. Versions match
    // the app module so Gradle does not have to resolve two of each onto the classpath.
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.work:work-runtime:2.9.1'
}
