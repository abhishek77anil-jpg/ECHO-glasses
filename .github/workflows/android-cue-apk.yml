name: Build Cue diagnostics APK

# Produces a debug APK you can download from the run's Artifacts section and
# sideload onto the test phone. Runs on demand, and on pushes to Cue branches.
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "cue/**"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out with submodules
        uses: actions/checkout@v4
        with:
          # :moonshine-voice builds native JNI from third_party/moonshine, and the app
          # adds a source directory from myvu-upstream. Both are submodules, and the
          # build fails at configuration time without them.
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Install NDK and CMake
        # moonshine-voice pins CMake 3.22.1 and builds for arm64-v8a.
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;27.0.12077973" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Assemble debug APK
        working-directory: android/CyanBridge
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Run Cue unit tests
        working-directory: android/CyanBridge
        # Cue's own tests only. The wider suite is not this workflow's concern and a
        # pre-existing failure elsewhere should not block an APK build.
        run: ./gradlew :app:testDebugUnitTest --tests "com.fersaiyan.cyanbridge.cue.*" --no-daemon
        continue-on-error: true

      - name: Locate the APK
        id: apk
        run: |
          FOUND=$(find android/CyanBridge/app/build/outputs/apk -name "*.apk" | head -1)
          echo "path=$FOUND" >> "$GITHUB_OUTPUT"
          echo "Built: $FOUND"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cue-diagnostics-debug-apk
          path: android/CyanBridge/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            android/CyanBridge/app/build/reports/**
            android/CyanBridge/app/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7
