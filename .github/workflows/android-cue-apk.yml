name: Build Cue diagnostics APK

# Produces a debug APK you can download from the run's Artifacts section and
# sideload onto the test phone. Runs on demand, and on pushes to Cue branches.
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "cue/**"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      # The Meta Wearables DAT SDK lives on GitHub Packages, which requires a token with
      # read:packages even though facebook/meta-wearables-dat-android is public.
      #
      # This is not optional for the build: app/build.gradle gates the *dependencies* on
      # this token but compiles devices/metarayban/** unconditionally, and MainActivity and
      # CommunityPluginsActivity import com.meta.wearable.dat.* directly. Without it,
      # :app:compileDebugKotlin fails on ~90 unresolved references.
      #
      # The automatic github.token cannot be used — it only grants package read for this
      # repository's own packages. Set a repository secret named META_DAT_TOKEN holding a
      # PAT with the read:packages scope.
      GITHUB_TOKEN: ${{ secrets.META_DAT_TOKEN }}

    steps:
      - name: Check out with submodules
        uses: actions/checkout@v4
        with:
          # :moonshine-voice builds native JNI from third_party/moonshine, and the app
          # adds a source directory from myvu-upstream. Both are submodules, and the
          # build fails at configuration time without them.
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Install NDK and CMake
        # moonshine-voice pins CMake 3.22.1 and builds for arm64-v8a.
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;27.0.12077973" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Fetch Git LFS objects in the vendored native sources
        # Moonshine keeps some generated C++ (e.g. cpp-annote/src/*_embedded.cpp) in Git
        # LFS. actions/checkout's `lfs` option covers the top-level repo, not submodules, so
        # without this the files arrive as LFS pointer text and clang tries to compile
        # "version https://git-lfs.github.com/spec/v1" as C++.
        run: |
          git -C third_party/moonshine lfs install --local
          git -C third_party/moonshine lfs pull
          head -c 64 third_party/moonshine/core/cpp-annote/src/community1_cpp_annote_embedded.cpp || true

      - name: Relax upstream -Werror in the vendored native build
        # third_party/moonshine/core/CMakeLists.txt line 18 applies
        # `-Wall -Wextra -pedantic -Werror` at directory level with no opt-out, and NDK 27's
        # clang diagnoses more than the toolchain upstream builds with — it fails on an
        # unused static in their own moonshine-c-api.cpp.
        #
        # This cannot be fixed from Gradle: CMake places CMAKE_CXX_FLAGS *before*
        # add_compile_options, so a -Wno-error we pass is overridden, and their -Wall would
        # re-enable the specific warning anyway. Patching the checkout is the only lever.
        # It touches a submodule working copy in CI only; nothing is committed.
        run: |
          sed -i 's/ -Werror//g' third_party/moonshine/core/CMakeLists.txt
          grep -n 'add_compile_options(-Wall' third_party/moonshine/core/CMakeLists.txt || true

      - name: Assemble debug APK
        working-directory: android/CyanBridge
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Run Cue unit tests
        working-directory: android/CyanBridge
        # Cue's own tests only. The wider suite is not this workflow's concern and a
        # pre-existing failure elsewhere should not block an APK build.
        run: ./gradlew :app:testDebugUnitTest --tests "com.fersaiyan.cyanbridge.cue.*" --no-daemon
        continue-on-error: true

      - name: Locate the APK
        id: apk
        run: |
          FOUND=$(find android/CyanBridge/app/build/outputs/apk -name "*.apk" | head -1)
          echo "path=$FOUND" >> "$GITHUB_OUTPUT"
          echo "Built: $FOUND"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cue-diagnostics-debug-apk
          path: android/CyanBridge/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK to a rolling release
        # Artifacts are zipped and require a signed-in GitHub session, which makes them
        # awkward to install from the test phone. A release asset is a direct, plain .apk
        # URL that stays the same across builds, so the phone can just tap it.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "${{ steps.apk.outputs.path }}" cue-diagnostics.apk
          gh release delete cue-latest --yes --cleanup-tag || true
          gh release create cue-latest cue-diagnostics.apk \
            --title "Cue Diagnostics (latest)" \
            --notes "Debug APK from ${{ github.sha }}. Sideload alongside CyanBridge; connect the glasses in the main app first." \
            --prerelease

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            android/CyanBridge/app/build/reports/**
            android/CyanBridge/app/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7
